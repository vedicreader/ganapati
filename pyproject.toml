[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ganapati"
dynamic = ["version"]
description = "Sanskrit philology for a search index: metre, verse chunking, citations, lemmas and glosses"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev', 'sanskrit', 'devanagari', 'metre', 'prosody', 'philology', 'search']
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "fastcore>=2.2.15",
    "litesearch>=0.1.33",
    "vidyut"
]

[project.urls]
Repository = "https://github.com/vedicreader/ganapati"
Documentation = "https://vedicreader.github.io/ganapati/"

[project.entry-points.nbdev]
ganapati = "ganapati._modidx:d"

[tool.nbdev]

[tool.hatch.build.targets.wheel]
packages = ["ganapati"]

[tool.hatch.build.targets.sdist]
include = ["/ganapati", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "ganapati/__init__.py"

[dependency-groups]
dev = ["ipykernel>=7.3.0", "nbdev>=3.3.4", "notebook>=7.6.1", "vidyut>=0.4.0"]